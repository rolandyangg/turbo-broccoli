<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll menu</title>
    <style>
      body { margin: 0; font: 16px system-ui; }
      section { height: 900px; padding: 20px; border-bottom: 1px solid #ccc; }
      #menu { position: fixed; inset: 0; background: #1a2639; display: none; padding: 80px 24px 24px; }
      #menu.open { display: block; }
      #menu a { display: block; padding: 28px 0; font-size: 26px; color: #ffbf8e; border-bottom: 1px solid #333; }
      /* ?fixed=1: the menu scrolls inside itself and the page behind is locked while it's open. */
      .fixed #menu { overflow-y: auto; overscroll-behavior: contain; }
      .fixed.menu-open { overflow: hidden; }
    </style>
  </head>
  <body>
    <button id="open" aria-label="Open menu">Menu</button>
    <div id="menu" role="dialog" aria-label="Mobile navigation">
      <a href="#a">Apply</a><a href="#b">About us</a><a href="#c">Our impact</a><a href="#d">Judges</a><a href="#e">Organize</a><a href="#f">Sponsor us</a><a class="last" href="#g">AI Hackathon</a>
    </div>
    <section>One</section><section>Two</section><section>Three</section><section>Four</section>
    <script>
      const fixed = new URLSearchParams(location.search).has('fixed');
      if (fixed) document.documentElement.classList.add('fixed');
      document.getElementById('open').onclick = () => {
        document.getElementById('menu').classList.add('open');
        if (fixed) document.documentElement.classList.add('menu-open');
      };
    </script>
  </body>
</html>
