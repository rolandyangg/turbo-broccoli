<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anchor lab</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #222; background: #fff; }
  header { position: sticky; top: 0; height: 72px; background: #1d1d1f; color: #fff; padding: 0 24px; display: flex; align-items: center; }
  main { padding: 24px; }
  .spacer { height: 1500px; }
  /* LAB-A1: no scroll-margin-top, so the heading lands under the sticky header. */
</style>
</head>
<body>
<header>Site header</header>
<main>
  <p>Intro.</p>
  <div class="spacer"></div>
  <h2 id="terms">Terms and conditions</h2>
  <p>The fine print.</p>
  <div class="spacer"></div>
</main>
</body>
</html>
